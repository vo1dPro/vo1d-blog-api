# Uses the user-provided Let's Encrypt certificate (apex + wildcard).
# Install as /etc/nginx/sites-available/vo1d-blog and enable in sites-enabled.
server {
    listen 80;
    server_name vo1d.bot.cd admin.vo1d.bot.cd api.vo1d.bot.cd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/vo1d.bot.cd/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/vo1d.bot.cd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name vo1d.bot.cd;
    root /var/www/vo1d-blog;
    index index.html;

    location ~ /\.(?!well-known/) { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/vo1d.bot.cd/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/vo1d.bot.cd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name admin.vo1d.bot.cd;
    root /var/www/vo1d-blog-admin;
    index index.html;

    location ~ /\.(?!well-known/) { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/vo1d.bot.cd/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/vo1d.bot.cd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name api.vo1d.bot.cd;
    # Multipart overhead above the application's 10 MiB image limit.
    client_max_body_size 12m;

    location = /objects { return 404; }
    location ^~ /objects/ {
        # Public image reads only. Never expose the MinIO console or write API.
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:9000/vo1d-media/;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
    }

    location / {
        # Keep original API paths: /health, /auth, /admin, /media, etc.
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Exactly one trusted proxy; replace client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
