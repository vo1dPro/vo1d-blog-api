name: vo1d-blog-api
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?required}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./docker/init-test-db.sh
        target: /docker-entrypoint-initdb.d/10-test-db.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGINS:?required}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
    entrypoint: ['/bin/sh', '/init/init-minio.sh']
    volumes:
      - type: bind
        source: ./docker/init-minio.sh
        target: /init/init-minio.sh
        read_only: true
        bind:
          create_host_path: false
  api:
    profiles: ['app']
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      PORT: 3000
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3100}
      HTTPS_PROXY: ${STEAM_DOCKER_HTTPS_PROXY:-}
      HTTP_PROXY: ${STEAM_DOCKER_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,minio,postgres
    ports:
      - '127.0.0.1:${PORT:-3100}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  minio_data:
